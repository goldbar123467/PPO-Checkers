[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "ppo-checkers"
version = "0.1.0"
description = "Reproducible PPO self-play system for American Checkers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium==1.3.0",
  "numpy==2.5.1",
  "psutil==7.2.2",
  "pyyaml==6.0.3",
  "torch==2.13.0",
  "wandb==0.28.1",
]

[dependency-groups]
dev = [
  "hypothesis==6.161.8",
  "mutmut==3.6.0",
  "mypy==2.3.0",
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pytest-xdist==3.8.0",
  "ruff==0.16.0",
  "types-psutil==7.2.2.20260518",
  "types-PyYAML==6.0.12.20260724",
]

[tool.hatch.build.targets.wheel]
packages = ["src/checkers"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", ".venv-checkers", ".venv-train", "cache", "models", "runs"]

[tool.ruff.lint]
select = ["ANN", "ARG", "B", "E", "ERA", "F", "I", "N", "PL", "PTH", "RET", "SIM", "UP", "W"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

[tool.pytest.ini_options]
testpaths = [
  "tests/agents",
  "tests/env",
  "tests/eval",
  "tests/golden",
  "tests/integration",
  "tests/metamorphic",
  "tests/property",
  "tests/rl",
  "tests/rules",
  "tests/web",
  "tests/test_checkpoint.py",
  "tests/test_logging_wandb.py",
  "tests/test_metric_history.py",
  "tests/test_monitor.py",
  "tests/test_practice_preflight.py",
  "tests/test_recovery.py",
  "tests/test_run_runtime.py",
  "tests/test_system_metrics.py",
]
pythonpath = [".", "src"]
addopts = "-ra --strict-config --strict-markers --cov=checkers --cov-branch --cov-report=term-missing --cov-fail-under=92"

[tool.mypy]
python_version = "3.12"
strict = true
exclude = "(^|/)(\\.venv|\\.venv-checkers|\\.venv-train|cache|models|runs)/"

[tool.coverage.run]
branch = true
source = ["checkers"]

[tool.coverage.report]
fail_under = 92
show_missing = true

[tool.mutmut]
source_paths = ["src/checkers/rules/"]
pytest_add_cli_args = ["--no-cov", "-q"]
pytest_add_cli_args_test_selection = ["tests/rules/", "tests/golden/", "tests/metamorphic/"]
also_copy = ["tests/golden/data/", "docs/"]
cache_invalidation_files = ["tests/golden/data/published_games.json"]
timeout_multiplier = 0.5
