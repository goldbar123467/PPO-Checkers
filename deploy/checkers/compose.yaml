services:
  checkers-web:
    image: ml-lab-checkers:${CHECKERS_RELEASE:-local}
    build:
      context: ../..
      dockerfile: deploy/checkers/Dockerfile
    container_name: checkers-web
    network_mode: host
    restart: unless-stopped
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 1024m
    cpus: 1.0
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ../../models/checkers/policies/checkers-practice-update-004608.pt:/app/model/policy.pt:ro
      - ../../models/checkers/policies/checkers-practice-update-004608.pt.sha256:/app/model/policy.pt.sha256:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 15s

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: checkers-caddy
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 15s

volumes:
  caddy_data:
  caddy_config:
